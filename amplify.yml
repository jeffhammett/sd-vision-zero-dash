version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm install
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist # Change to 'build' if using a framework like Create React App
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
